<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeStream - Personal Anime Platform</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Sidebar -->
    <nav class="sidebar">
        <div class="logo">
            <i class="fas fa-play-circle"></i>
            <span>AnimeStream</span>
        </div>
        
        <ul class="nav-menu">
            <li class="nav-item active" data-page="home">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </li>
            <li class="nav-item" data-page="search">
                <i class="fas fa-search"></i>
                <span>Search</span>
            </li>
            <li class="nav-item" data-page="bookmarks">
                <i class="fas fa-bookmark"></i>
                <span>Bookmarks</span>
            </li>
            <li class="nav-item" data-page="history">
                <i class="fas fa-history"></i>
                <span>History</span>
            </li>
            <li class="nav-item" data-page="continue">
                <i class="fas fa-forward"></i>
                <span>Continue Watching</span>
            </li>
            <li class="nav-item" data-page="stats">
                <i class="fas fa-chart-bar"></i>
                <span>Statistics</span>
            </li>
        </ul>
        
        <div class="random-anime">
            <button id="randomBtn">
                <i class="fas fa-random"></i> Random Anime
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Header -->
        <header class="top-bar">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search anime...">
                <button id="searchBtn"><i class="fas fa-search"></i></button>
            </div>
            <div class="user-info">
                <span id="onlineStatus">🟢 Online</span>
            </div>
        </header>

        <!-- Content Area -->
        <div class="content" id="contentArea">
            <!-- Home Page -->
            <div class="page active" id="home-page">
                <h1>Welcome to AnimeStream</h1>
                <div class="anime-sections">
                    <section class="anime-section">
                        <h2>Latest Episodes</h2>
                        <div class="anime-grid" id="latestAnime"></div>
                    </section>
                    <section class="anime-section">
                        <h2>Continue Watching</h2>
                        <div class="anime-grid" id="continueWatching"></div>
                    </section>
                </div>
            </div>

            <!-- Search Page -->
            <div class="page" id="search-page">
                <h1>Search Results</h1>
                <div class="anime-grid" id="searchResults"></div>
            </div>

            <!-- Bookmarks Page -->
            <div class="page" id="bookmarks-page">
                <h1>My Bookmarks</h1>
                <button id="exportBookmarks" class="btn-primary">
                    <i class="fas fa-download"></i> Export Bookmarks
                </button>
                <div class="anime-grid" id="bookmarksList"></div>
            </div>

            <!-- History Page -->
            <div class="page" id="history-page">
                <h1>Watch History</h1>
                <div class="history-list" id="historyList"></div>
            </div>

            <!-- Continue Watching Page -->
            <div class="page" id="continue-page">
                <h1>Continue Watching</h1>
                <div class="anime-grid" id="continueList"></div>
            </div>

            <!-- Stats Page -->
            <div class="page" id="stats-page">
                <h1>Statistics</h1>
                <div class="stats-grid" id="statsData"></div>
            </div>

            <!-- Anime Detail Page -->
            <div class="page" id="detail-page">
                <button class="back-btn"><i class="fas fa-arrow-left"></i> Back</button>
                <div class="anime-detail" id="animeDetail"></div>
                <div class="episodes-section">
                    <h2>Episodes</h2>
                    <div class="episode-grid" id="episodeList"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Player Modal -->
    <div class="modal" id="playerModal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div class="player-container">
                <iframe id="videoPlayer" allowfullscreen></iframe>
            </div>
            <div class="player-controls">
                <h3 id="currentAnimeTitle"></h3>
                <p id="currentEpisode"></p>
                <div id="serverSelector"></div>
                <div class="controls">
                    <button id="prevEpisode" class="btn-primary">
                        <i class="fas fa-step-backward"></i> Previous
                    </button>
                    <button id="bookmarkBtn" class="btn-secondary">
                        <i class="fas fa-bookmark"></i> Bookmark
                    </button>
                    <button id="nextEpisode" class="btn-primary">
                        Next <i class="fas fa-step-forward"></i>
                    </button>
                </div>
                <div class="download-section" id="downloadLinks"></div>
            </div>
        </div>
    <!-- Mobile Bottom Navigation Bar -->
    <nav class="mobile-bottom-nav">
        <a class="mobile-nav-item active" data-page="home">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a class="mobile-nav-item" data-page="search">
            <i class="fas fa-search"></i>
            <span>Search</span>
        </a>
        <a class="mobile-nav-item" data-page="bookmarks">
            <i class="fas fa-bookmark"></i>
            <span>Bookmarks</span>
        </a>
        <a class="mobile-nav-item" data-page="history">
            <i class="fas fa-history"></i>
            <span>History</span>
        </a>
        <a class="mobile-nav-item" data-page="continue">
            <i class="fas fa-forward"></i>
            <span>Continue</span>
        </a>
    </nav>

    <script src="js/app.js"></script>
</body>
</html>
